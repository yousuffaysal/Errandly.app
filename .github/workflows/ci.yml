name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Apple Silicon runner: the bundled AI runtime is arm64.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - name: Fetch the bundled AI runtime (pinned, checksum-verified)
        run: sh scripts/fetch-runtime.sh

      - name: Type-check
        run: pnpm typecheck
      - name: UI smoke tests
        run: pnpm test
      - name: Build the UI
        run: pnpm build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Dependency audit (JavaScript)
        run: pnpm audit --prod
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Dependency audit (Rust)
        # RUSTSEC-2026-0187 (lopdf < 0.42 stack overflow when *parsing* a crafted
        # PDF) only affects lopdf 0.26 pulled in by genpdf, which writes PDFs
        # and never parses one. PDFs are read with PDFKit and pdf-extract,
        # whose lopdf (0.42) is patched.
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0187
