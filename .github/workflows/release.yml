name: Release

# Push a tag like v0.2.0 to build and publish a draft release. Publish the
# draft on GitHub when you're happy with it: installed copies of Errandly check
# its latest.json for updates, and the website's download button points at
# releases/latest/download/Errandly-mac.dmg.
#
# Without Apple secrets the app is ad-hoc signed (free; users approve it once
# with "Open Anyway"). Add the Apple secrets from docs/RELEASING.md and the
# same workflow signs and notarizes it instead.
on:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile

      # ---- Signed and notarized (Apple Developer Program) ----
      # The certificate must be in the keychain before the bundled runtime is
      # signed (scripts/sign-runtime.sh runs before bundling).
      - name: Import signing certificate
        if: env.SIGNED == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build, sign, notarize and publish (signed)
        if: env.SIGNED == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Errandly ${{ github.ref_name }}
          releaseBody: See the changelog for what's new.
          releaseDraft: true
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin

      # ---- Free: ad-hoc signed (signingIdentity "-" in tauri.conf.json) ----
      - name: Build and publish (ad-hoc signed)
        if: env.SIGNED != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Errandly ${{ github.ref_name }}
          releaseBody: |
            First launch on macOS: open Errandly, click Done, then go to
            System Settings → Privacy & Security → "Open Anyway". Only needed once.
          releaseDraft: true
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin

      # A fixed name, so the website's download link never changes:
      # https://github.com/<owner>/<repo>/releases/latest/download/Errandly-mac.dmg
      - name: Attach Errandly-mac.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$dmg" Errandly-mac.dmg
          gh release upload "${{ github.ref_name }}" Errandly-mac.dmg --clobber
